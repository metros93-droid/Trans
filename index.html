<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1:1 마주보기 실시간 번역기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            touch-action: manipulation;
            background-color: #f0f4f8;
        }
        /* Rotated top screen for face-to-face viewing */
        .upside-down {
            transform: rotate(180deg);
        }
        /* Custom scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-slate-200">

    <!-- Smartphone Frame Container -->
    <div class="w-full max-w-md h-[100vh] sm:h-[840px] bg-black sm:rounded-[45px] shadow-2xl overflow-hidden flex flex-col relative border-[6px] border-slate-800">
        
        <!-- Phone Camera Notch -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-4 bg-black rounded-full z-50 hidden sm:block"></div>

        <!-- APP CONTENT AREA -->
        <div id="app" class="flex-1 flex flex-col h-full overflow-hidden bg-white">
            
            <!-- TOP SECTION (Opposite Person View - Rotated 180deg) -->
            <div id="topSection" class="h-1/2 bg-sky-200 p-4 flex flex-col justify-between upside-down transition-colors duration-300 relative border-b-2 border-sky-300">
                <!-- Header Controls for Top Screen -->
                <div class="flex justify-between items-center text-sky-800 font-semibold text-sm">
                    <div class="flex items-center space-x-2">
                        <span id="topFlag" class="text-xl">🇯🇵</span>
                        <span id="topLangLabel" class="text-base font-bold">일본어</span>
                    </div>
                    <button id="topSpeakBtn" onclick="speakText('top')" class="p-2 rounded-full bg-sky-300/60 hover:bg-sky-300 active:scale-95 transition text-sky-900" title="음성 듣기">
                        <i class="fa-solid fa-volume-high text-lg"></i>
                    </button>
                </div>

                <!-- Text Display Area (Top) -->
                <div class="flex-1 flex flex-col justify-center my-2 custom-scrollbar overflow-y-auto px-2">
                    <p id="topText" class="text-xl sm:text-2xl text-slate-800 font-medium leading-relaxed text-center break-keep">
                        こんにちは！お会いできて嬉しいです。
                    </p>
                    <p id="topSubText" class="text-xs text-sky-700 text-center mt-2 italic min-h-[1rem]"></p>
                </div>

                <!-- Status Indicator -->
                <div class="flex justify-between items-center text-xs text-sky-700 font-medium px-1">
                    <span id="topStatus">상대방에게 보이는 화면입니다</span>
                    <button onclick="toggleRotate('top')" class="text-sky-800 hover:text-black">
                        <i class="fa-solid fa-rotate text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- MIDDLE BAR (Language Selector & Switcher) -->
            <div class="bg-slate-800 text-white py-2 px-4 flex justify-between items-center shadow-md z-20">
                <!-- Top Language Select -->
                <select id="topLangSelect" onchange="onLanguageChange()" class="bg-slate-700 text-white text-xs sm:text-sm font-semibold rounded-lg px-2 py-1 outline-none border border-slate-600">
                    <option value="ja-JP" selected>🇯🇵 일본어</option>
                    <option value="en-US">🇺🇸 영어</option>
                    <option value="zh-CN">🇨🇳 중국어</option>
                    <option value="es-ES">🇪🇸 스페인어</option>
                    <option value="fr-FR">🇫🇷 프랑스어</option>
                    <option value="de-DE">🇩🇪 독일어</option>
                    <option value="vi-VN">🇻🇳 베트남어</option>
                    <option value="ko-KR">🇰🇷 한국어</option>
                </select>

                <!-- Language Swap Button -->
                <button onclick="swapLanguages()" class="bg-sky-500 hover:bg-sky-400 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i class="fa-solid fa-arrow-up-down text-xs"></i>
                </button>

                <!-- Bottom Language Select -->
                <select id="bottomLangSelect" onchange="onLanguageChange()" class="bg-slate-700 text-white text-xs sm:text-sm font-semibold rounded-lg px-2 py-1 outline-none border border-slate-600">
                    <option value="ko-KR" selected>🇰🇷 한국어</option>
                    <option value="ja-JP">🇯🇵 일본어</option>
                    <option value="en-US">🇺🇸 영어</option>
                    <option value="zh-CN">🇨🇳 중국어</option>
                    <option value="es-ES">🇪🇸 스페인어</option>
                </select>
            </div>

            <!-- BOTTOM SECTION (User View) -->
            <div id="bottomSection" class="h-1/2 bg-lime-100 p-4 flex flex-col justify-between transition-colors duration-300 relative">
                <!-- Header Controls for Bottom Screen -->
                <div class="flex justify-between items-center text-lime-900 font-semibold text-sm">
                    <div class="flex items-center space-x-2">
                        <span id="bottomFlag" class="text-xl">🇰🇷</span>
                        <span id="bottomLangLabel" class="text-base font-bold">한국어</span>
                    </div>
                    <div class="flex space-x-1">
                        <button id="keyboardBtn" onclick="openTextInputModal()" class="p-2 rounded-full bg-lime-200/80 hover:bg-lime-200 active:scale-95 transition text-lime-900" title="직접 키보드 입력">
                            <i class="fa-solid fa-keyboard text-lg"></i>
                        </button>
                        <button id="bottomSpeakBtn" onclick="speakText('bottom')" class="p-2 rounded-full bg-lime-200/80 hover:bg-lime-200 active:scale-95 transition text-lime-900" title="음성 듣기">
                            <i class="fa-solid fa-volume-high text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Text Display Area (Bottom) -->
                <div class="flex-1 flex flex-col justify-center my-2 custom-scrollbar overflow-y-auto px-2">
                    <p id="bottomText" class="text-xl sm:text-2xl text-slate-800 font-medium leading-relaxed text-center break-keep">
                        안녕하세요! 반갑습니다. 오늘 날씨는 어떤가요?
                    </p>
                    <p id="bottomSubText" class="text-xs text-lime-800 text-center mt-2 italic min-h-[1rem]"></p>
                </div>

                <!-- Mic Action Controls (Push to Talk) -->
                <div class="flex justify-around items-center pt-1 pb-2">
                    <!-- Top Speaker Speech Recognition Button (Push to Talk) -->
                    <button id="topMicBtn" 
                            onmousedown="startPushToTalk('top', event)" 
                            onmouseup="stopPushToTalk('top', event)" 
                            mouseleave="stopPushToTalk('top', event)"
                            ontouchstart="startPushToTalk('top', event)" 
                            ontouchend="stopPushToTalk('top', event)"
                            ontouchcancel="stopPushToTalk('top', event)"
                            class="w-16 h-16 rounded-full bg-sky-500 text-white flex flex-col items-center justify-center shadow-lg active:scale-95 transition hover:bg-sky-600 relative select-none touch-none cursor-pointer">
                        <i id="topMicIcon" class="fa-solid fa-microphone text-2xl"></i>
                        <span id="topMicLabel" class="text-[10px] font-bold mt-0.5 pointer-events-none">누르고 말하기</span>
                    </button>

                    <!-- Status Text Badge -->
                    <div id="listeningBadge" class="hidden flex items-center space-x-1.5 bg-red-500 text-white px-3 py-1.5 rounded-full text-xs font-bold animate-pulse shadow-md">
                        <i class="fa-solid fa-circle text-[8px]"></i>
                        <span id="listeningText">듣는 중...</span>
                    </div>

                    <!-- Bottom Speaker Speech Recognition Button (Push to Talk) -->
                    <button id="bottomMicBtn" 
                            onmousedown="startPushToTalk('bottom', event)" 
                            onmouseup="stopPushToTalk('bottom', event)" 
                            mouseleave="stopPushToTalk('bottom', event)"
                            ontouchstart="startPushToTalk('bottom', event)" 
                            ontouchend="stopPushToTalk('bottom', event)"
                            ontouchcancel="stopPushToTalk('bottom', event)"
                            class="w-16 h-16 rounded-full bg-lime-600 text-white flex flex-col items-center justify-center shadow-lg active:scale-95 transition hover:bg-lime-700 relative select-none touch-none cursor-pointer">
                        <i id="bottomMicIcon" class="fa-solid fa-microphone text-2xl"></i>
                        <span id="bottomMicLabel" class="text-[10px] font-bold mt-0.5 pointer-events-none">누르고 말하기</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Text Input Modal (Optional Typing) -->
    <div id="textModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800">문장 직접 입력하기</h3>
                <button onclick="closeTextInputModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <textarea id="modalTextInput" rows="3" class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm text-slate-800" placeholder="번역할 내용을 입력하세요..."></textarea>
            <div class="flex justify-end space-x-2">
                <button onclick="closeTextInputModal()" class="px-4 py-2 rounded-xl text-slate-600 text-sm hover:bg-slate-100">취소</button>
                <button onclick="submitTextInput()" class="px-5 py-2 rounded-xl bg-sky-500 text-white text-sm font-semibold hover:bg-sky-600">번역 실행</button>
            </div>
        </div>
    </div>

    <!-- Toast Modal -->
    <div id="toastModal" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white px-4 py-2 rounded-full text-xs z-50 shadow-lg hidden transition-opacity duration-300">
        <span id="toastMsg">알림 메시지</span>
    </div>

    <script>
        // Language metadata mapping
        const LANG_MAP = {
            'ko-KR': { name: '한국어', flag: '🇰🇷' },
            'ja-JP': { name: '일본어', flag: '🇯🇵' },
            'en-US': { name: '영어', flag: '🇺🇸' },
            'zh-CN': { name: '중국어', flag: '🇨🇳' },
            'es-ES': { name: '스페인어', flag: '🇪🇸' },
            'fr-FR': { name: '프랑스어', flag: '🇫🇷' },
            'de-DE': { name: '독일어', flag: '🇩🇪' },
            'vi-VN': { name: '베트남어', flag: '🇻🇳' }
        };

        // State Management
        let recognition = null;
        let isListening = false;
        let activeSide = null; // 'top' or 'bottom'
        let fullRecognizedText = '';

        function showToast(msg) {
            const toast = document.getElementById('toastModal');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        window.onload = () => {
            onLanguageChange();
            initSpeechRecognition();
        };

        // Initialize Native Browser Speech Recognition for Push-To-Talk
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("이 브라우저/환경은 음성 인식을 지원하지 않습니다.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                updateMicUI(true);
            };

            recognition.onresult = (event) => {
                let currentText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentText += event.results[i][0].transcript;
                }

                if (currentText.trim()) {
                    const targetElId = (activeSide === 'top') ? 'topText' : 'bottomText';
                    const targetEl = document.getElementById(targetElId);
                    targetEl.textContent = currentText;
                    fullRecognizedText = currentText;
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    showToast("마이크 권한이 거부되었습니다.");
                }
            };

            recognition.onend = () => {
                updateMicUI(false);
                if (fullRecognizedText.trim() && activeSide) {
                    translateFinalResult(fullRecognizedText.trim(), activeSide);
                }
            };
        }

        // Push to Talk: Touch Start / Mouse Down
        async function startPushToTalk(side, event) {
            if (event) {
                event.preventDefault();
            }

            if (isListening) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("현재 브라우저는 음성 인식을 지원하지 않습니다.");
                return;
            }

            // Request mic permission on user gesture
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop());
                } catch (err) {
                    showToast("마이크 접근 권한을 허용해 주세요.");
                    return;
                }
            }

            if (!recognition) {
                initSpeechRecognition();
            }

            activeSide = side;
            fullRecognizedText = '';
            isListening = true;

            const langCode = (side === 'top') 
                ? document.getElementById('topLangSelect').value 
                : document.getElementById('bottomLangSelect').value;

            recognition.lang = langCode;

            if (side === 'top') {
                document.getElementById('topText').textContent = "말씀하시는 동안 버튼을 누르고 계세요...";
            } else {
                document.getElementById('bottomText').textContent = "말씀하시는 동안 버튼을 누르고 계세요...";
            }

            try {
                recognition.start();
            } catch (e) {
                console.error("Push-To-Talk Start Error:", e);
                isListening = false;
                updateMicUI(false);
            }
        }

        // Push to Talk: Touch End / Mouse Up / Leave
        function stopPushToTalk(side, event) {
            if (event) {
                event.preventDefault();
            }

            if (!isListening || activeSide !== side) return;

            isListening = false;
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    console.error("Push-To-Talk Stop Error:", e);
                }
            }
            updateMicUI(false);
        }

        function updateMicUI(listening) {
            const topBtn = document.getElementById('topMicBtn');
            const bottomBtn = document.getElementById('bottomMicBtn');
            const badge = document.getElementById('listeningBadge');

            if (listening) {
                badge.classList.remove('hidden');
                if (activeSide === 'top') {
                    topBtn.classList.add('ring-4', 'ring-red-400', 'bg-red-500', 'scale-105');
                    bottomBtn.classList.add('opacity-50');
                } else {
                    bottomBtn.classList.add('ring-4', 'ring-red-400', 'bg-red-500', 'scale-105');
                    topBtn.classList.add('opacity-50');
                }
            } else {
                badge.classList.add('hidden');
                topBtn.classList.remove('ring-4', 'ring-red-400', 'bg-red-500', 'scale-105', 'opacity-50');
                bottomBtn.classList.remove('ring-4', 'ring-red-400', 'bg-red-500', 'scale-105', 'opacity-50');
            }
        }

        async function translateFinalResult(text, side) {
            const topLang = document.getElementById('topLangSelect').value;
            const bottomLang = document.getElementById('bottomLangSelect').value;

            if (side === 'top') {
                document.getElementById('topText').textContent = text;
                document.getElementById('bottomText').textContent = "번역 중...";
                const translated = await translateTextWithGemini(text, topLang, bottomLang);
                document.getElementById('bottomText').textContent = translated;
                speakText('bottom', translated, bottomLang);
            } else {
                document.getElementById('bottomText').textContent = text;
                document.getElementById('topText').textContent = "번역 중...";
                const translated = await translateTextWithGemini(text, bottomLang, topLang);
                document.getElementById('topText').textContent = translated;
                speakText('top', translated, topLang);
            }
        }

        async function translateTextWithGemini(text, sourceLangCode, targetLangCode) {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const sourceLangName = LANG_MAP[sourceLangCode]?.name;
            const targetLangName = LANG_MAP[targetLangCode]?.name;

            const systemPrompt = `You are a translator. Translate the text from ${sourceLangName} to ${targetLangName}. Return JSON with key 'translation'.`;

            const payload = {
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (jsonText) {
                    return JSON.parse(jsonText).translation;
                }
                return text;
            } catch (err) {
                console.error("Translation Error:", err);
                return text;
            }
        }

        function speakText(side, customText = null, customLang = null) {
            window.speechSynthesis.cancel();
            const text = customText || (side === 'top' ? document.getElementById('topText').textContent : document.getElementById('bottomText').textContent);
            const lang = customLang || (side === 'top' ? document.getElementById('topLangSelect').value : document.getElementById('bottomLangSelect').value);

            if (!text || text.includes("번역 중...") || text.includes("듣는 중...")) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function onLanguageChange() {
            const topCode = document.getElementById('topLangSelect').value;
            const bottomCode = document.getElementById('bottomLangSelect').value;

            document.getElementById('topFlag').textContent = LANG_MAP[topCode].flag;
            document.getElementById('topLangLabel').textContent = LANG_MAP[topCode].name;

            document.getElementById('bottomFlag').textContent = LANG_MAP[bottomCode].flag;
            document.getElementById('bottomLangLabel').textContent = LANG_MAP[bottomCode].name;
        }

        function swapLanguages() {
            const topSelect = document.getElementById('topLangSelect');
            const bottomSelect = document.getElementById('bottomLangSelect');
            
            const temp = topSelect.value;
            topSelect.value = bottomSelect.value;
            bottomSelect.value = temp;

            onLanguageChange();
        }

        function toggleRotate(side) {
            if (side === 'top') {
                const el = document.getElementById('topSection');
                el.classList.toggle('upside-down');
            }
        }

        function openTextInputModal() {
            document.getElementById('textModal').classList.remove('hidden');
            document.getElementById('modalTextInput').focus();
        }

        function closeTextInputModal() {
            document.getElementById('textModal').classList.add('hidden');
            document.getElementById('modalTextInput').value = '';
        }

        function submitTextInput() {
            const inputVal = document.getElementById('modalTextInput').value;
            if (inputVal.trim()) {
                translateFinalResult(inputVal, 'bottom');
                closeTextInputModal();
            }
        }
    </script>
</body>
</html>
